<!DOCTYPE html>
<html>
<head>
    <title>Folder Display Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test-case { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .pass { background: #d4edda; }
        .fail { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>文件夹名称显示测试</h1>
    
    <div class="test-case">
        <h3>后端返回的JSON格式：</h3>
        <pre id="backend-json"></pre>
    </div>
    
    <div class="test-case">
        <h3>前端类型定义期望的字段：</h3>
        <pre id="frontend-type"></pre>
    </div>
    
    <div class="test-case" id="result">
        <h3>测试结果：</h3>
        <p id="result-text"></p>
    </div>

    <script>
        // 模拟后端返回的数据
        const backendData = {
            ID: 1,
            name: "根目录",
            parentId: null,
            ownerId: 1,
            path: "/",
            isPublic: "N",
            Children: [
                {
                    ID: 2,
                    name: "测试文件夹",
                    parentId: 1,
                    ownerId: 1,
                    path: "/测试文件夹",
                    isPublic: "N"
                }
            ]
        };

        document.getElementById('backend-json').textContent = JSON.stringify(backendData, null, 2);

        document.getElementById('frontend-type').textContent = `
interface Folder {
  ID: number
  name: string            // ✓ 匹配后端
  parentId: number | null // ✓ 匹配后端
  ownerId: number         // ✓ 匹配后端
  path: string
  isPublic: string
  Children?: Folder[]
}`;

        // 测试访问
        const resultDiv = document.getElementById('result');
        const resultText = document.getElementById('result-text');
        
        try {
            const folderName = backendData.name;
            const childName = backendData.Children[0].name;
            
            if (folderName === "根目录" && childName === "测试文件夹") {
                resultDiv.className = 'test-case pass';
                resultText.textContent = '✓ 测试通过！字段名称匹配，可以正确访问 folder.name';
            } else {
                throw new Error('字段访问失败');
            }
        } catch (e) {
            resultDiv.className = 'test-case fail';
            resultText.textContent = '✗ 测试失败：' + e.message;
        }
    </script>
</body>
</html>
