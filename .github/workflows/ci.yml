name: Sky-Web CI

on:
  push:
    branches: [main, master, develop, 'v*']
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # 真实类型检查（package.json 中的 typecheck 脚本带 --noCheck，不报类型错误）
      - name: Typecheck
        run: npx vue-tsc -b --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build
